name: Push reminders
# «هل قرأت التحصين؟» to every registered device, about every 6 hours:
# 05:13, 11:13, 17:13, 23:13 Riyadh time (cron is UTC). GitHub may start scheduled runs a few minutes late.
on:
  schedule:
    - cron: '13 2,8,14,20 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: push-reminders
  cancel-in-progress: false
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock --silent web-push@4.0.0
      - run: node tools/send-push.mjs
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      - name: Remove expired devices / keep the schedule alive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # GitHub turns off schedules in public repositories after 60 days without commits
          last=$(git log -1 --format=%ct); now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 45 ]; then mkdir -p push; date -u +%F > push/.keepalive; fi
          if [ -n "$(git status --porcelain -- push)" ]; then
            git add -A -- push
            git commit -m "تحديث قائمة أجهزة الإشعارات"
            git push
          fi
