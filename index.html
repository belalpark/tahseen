<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تحصين · الرقية الشرعية</title>
<meta name="description" content="تحصين — الرقية الشرعية مرتبة صفحةً صفحة: التحريج والتحصين، ثم الفاتحة والبقرة والسور، بخط مصحف المدينة، مع القراءة والاستماع.">
<meta name="theme-color" content="#041a10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="تحصين">
<meta name="application-name" content="تحصين">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta property="og:title" content="تحصين · الرقية الشرعية">
<meta property="og:description" content="الرقية الشرعية مرتبة صفحةً صفحة — قراءة واستماع">
<meta property="og:image" content="icons/icon-512.png">
<link rel="preload" href="fonts/UthmanicHafs-v-3.0.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" aria-live="polite">
  <div class="splash"><img src="icons/logo-mark.png" alt="" width="120" height="120"><b class="goldtxt">تحصين</b></div>
</div>

<!-- settings sheet -->
<div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-grip"></div>
  <h2 id="sheetTitle">الإعدادات</h2>

  <div class="set-row">
    <label for="fsRange">حجم الخط</label>
    <div class="fs-ctl">
      <button class="chip" data-fs="-" aria-label="تصغير الخط">أ−</button>
      <input type="range" id="fsRange" min="0.8" max="1.8" step="0.05">
      <button class="chip" data-fs="+" aria-label="تكبير الخط">أ+</button>
    </div>
  </div>

  <div class="set-row">
    <span class="lbl">المظهر</span>
    <div class="seg" id="themeSeg">
      <button data-theme="dark">ليلي</button>
      <button data-theme="light">نهاري</button>
    </div>
  </div>

  <div class="set-row">
    <label for="reciterSel">القارئ</label>
    <select id="reciterSel"></select>
  </div>

  <div class="set-row">
    <span class="lbl">تكرار كل صفحة عند الاستماع</span>
    <div class="seg" id="repeatSeg">
      <button data-rep="1">مرة</button>
      <button data-rep="3">3 مرات</button>
      <button data-rep="7">7 مرات</button>
    </div>
  </div>

  <div class="set-row">
    <label for="autoChk">الانتقال تلقائياً للصفحة التالية بعد انتهاء التلاوة</label>
    <input type="checkbox" id="autoChk" class="switch">
  </div>

  <div class="set-row">
    <label for="wakeChk">إبقاء الشاشة مضاءة أثناء القراءة</label>
    <input type="checkbox" id="wakeChk" class="switch">
  </div>

  <div class="set-row">
    <span class="lbl">إشعار «هل قرأت التحصين؟» كل 6 ساعات</span>
    <button class="btn ghost small" id="pushBtn">تفعيل</button>
  </div>

  <div class="set-row">
    <span class="lbl">إعداد الإشعارات (مرة واحدة لصاحب الموقع)</span>
    <a class="btn ghost small" id="pushSetupLink" href="#/push-setup" onclick="document.getElementById('sheet').hidden=true;document.getElementById('sheetBackdrop').hidden=true">فتح</a>
  </div>

  <div class="set-row">
    <span class="lbl">الجلسة الحالية</span>
    <button class="btn ghost small" id="resetBtn">تصفير الجلسة</button>
  </div>

  <div class="set-row">
    <span class="lbl">سجل القراءات</span>
    <button class="btn ghost small" id="clearHistBtn">مسح السجل</button>
  </div>

  <button class="btn gold block" id="sheetClose">تم</button>
</section>

<!-- generic modal sheet -->
<div class="sheet-backdrop" id="modalBackdrop" hidden></div>
<section class="sheet" id="modal" role="dialog" aria-modal="true" hidden></section>

<div class="toast" id="toast" role="status" hidden></div>

<script src="app.js" defer></script>
</body>
</html>
